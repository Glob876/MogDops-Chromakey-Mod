plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven {
        url 'https://maven.fabricmc.net/'
    }
}

// Нативное разделение окружений в Fabric Loom 1.17+
loom {
    splitEnvironmentSourceSets()
    mods {
        "mogdops-chromakey-mod" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    
    // В Minecraft 26.1+ зависимость mappings() намеренно удалена, 
    // так как игра поставляется уже деобфусцированной.
    
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25 // Требуется Java 25
}

tasks.withType(Javadoc).configureEach {
	enabled = false
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Глобальное отключение конфликтов дубликатов ресурсов
tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
// Development-only integration checks, excluded from published JARs.
if (project.hasProperty('qa')) {
    sourceSets {
        qaClient {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
            compileClasspath += sourceSets.client.compileClasspath + sourceSets.client.output
            runtimeClasspath += sourceSets.client.runtimeClasspath + sourceSets.client.output
        }
    }
    loom {
        mods { chromakey_qa { sourceSet sourceSets.qaClient } }
        runs {
            qaClient {
                client()
                source sourceSets.qaClient
                runDir 'build/qa-client'
                vmArg '-Dchromakey.qa=true'
                vmArg '-Dorg.lwjgl.opengl.libname=/usr/lib/libGL.so.1'
                programArgs '--width', '1000', '--height', '700'
                programArgs '--graphicsBackend', 'opengl'
            }
        }
    }
}
