buildscript {
    repositories {
        mavenCentral()
        maven {
            url 'https://maven.fabricmc.net/'
        }
    }
    dependencies {
        classpath "net.fabricmc:fabric-loom:${loom_version}"
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'maven-publish'

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    mavenCentral()
    maven {
        url 'https://maven.fabricmc.net/'
    }
    // Репозиторий библиотеки owo-lib
    maven {
        url 'https://maven.wispforest.io/releases/'
    }
    // Репозиторий для kdl4j и других GitHub-зависимостей
    maven {
        url 'https://jitpack.io'
    }
}

sourceSets {
    main {
        java {
            srcDirs 'src/main/java', 'src/client/java'
        }
        resources {
            srcDirs 'src/main/resources', 'src/client/resources'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"


}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 8
}

tasks.withType(Javadoc).configureEach {
	enabled = false
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_1_8
	targetCompatibility = JavaVersion.VERSION_1_8
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// Глобальное отключение конфликтов дубликатов ресурсов
tasks.withType(AbstractCopyTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
	}
}
// Development-only integration checks, excluded from published JARs.
if (project.hasProperty('qa')) {
    sourceSets {
        qaClient {
            compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
            runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
        }
    }
    loom {
        mods { chromakey_qa { sourceSet sourceSets.qaClient } }
        runs {
            qaClient {
                client()
                source sourceSets.qaClient
                runDir 'build/qa-client'
                vmArg '-Dchromakey.qa=true'
                vmArg '-Dorg.lwjgl.opengl.libname=/usr/lib/libGL.so.1'
                programArgs '--width', '1000', '--height', '700'
            }
        }
    }
}

// Minecraft 1.16.5 is tested on its original Java 8 runtime.
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(8) }
}
